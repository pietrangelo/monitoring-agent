# The hub is a workspace of two members: the hub binary and its store (RFC 0010 §1). The
# agent at the repository root stays an independent crate.
[workspace]
members = ["hub-store"]

[package]
name = "system-hub"
version = "0.1.0"
edition = "2024"
description = "Centralized monitoring hub for multiple system-agent instances"

[dependencies]
axum = { version = "0.7", features = ["macros", "ws"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
tower = { version = "0.4", features = ["util"] }
tracing = "0.1"
tracing-subscriber = "0.3"
futures-core = "0.3"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
rmp-serde = "1"
subtle = "2"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
chacha20poly1305 = "0.10"
base64 = "0.22"
hkdf = "0.12"
sha2 = "0.10"
mail-parser = { version = "0.11", default-features = false }

[dev-dependencies]
tempfile = "3"
futures-util = "0.3"
